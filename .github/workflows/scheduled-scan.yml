name: Scheduled Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:       # Manual trigger available from GitHub Actions UI

jobs:
  dependency-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Run pip-audit
        id: pip_audit
        continue-on-error: true
        run: pip-audit -r requirements.txt
      - name: Run pip-audit on the bundled wheels the app ships
        id: pip_audit_wheels
        continue-on-error: true
        run: |
          python3 scripts/release_manifest.py requirements > "$RUNNER_TEMP/shipped-requirements.txt"
          pip-audit -r "$RUNNER_TEMP/shipped-requirements.txt" --disable-pip --require-hashes
      - name: Run pip-audit on the asset's Python packages
        id: pip_audit_asset
        continue-on-error: true
        run: |
          python3 scripts/release_manifest.py asset-requirements > "$RUNNER_TEMP/asset-requirements.txt"
          pip-audit -r "$RUNNER_TEMP/asset-requirements.txt" --disable-pip --no-deps
      # trivy-action's own installer (setup-trivy) downloads from get.trivy.dev, which does not
      # resolve (curl exit 6, from 4 Nov 2026). Install the same Trivy release from GitHub,
      # checked against a pinned SHA-256, and tell the action to skip its installer.
      - name: Install Trivy 0.70.0 (pinned, checksum-verified)
        env:
          TRIVY_VERSION: 0.70.0
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          cd "$RUNNER_TEMP"                # keep the download out of the scanned checkout
          TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO --connect-timeout 30 --max-time 300 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TARBALL}"
          echo "${TRIVY_SHA256}  ${TARBALL}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$TARBALL" -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version
      - name: Run Trivy filesystem scan (Python deps, misconfig, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          exit-code: '1'
          limit-severities-for-sarif: true
      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@17a820bf2e43b47be2c72b39cc905417bc1ab6d0  # v3.28.6
        with:
          sarif_file: trivy.sarif
      - name: Fail if pip-audit found vulnerabilities
        if: >-
          always() && (steps.pip_audit.outcome == 'failure'
          || steps.pip_audit_wheels.outcome == 'failure'
          || steps.pip_audit_asset.outcome == 'failure')
        run: |
          echo "pip-audit detected vulnerabilities — see results above"
          exit 1
