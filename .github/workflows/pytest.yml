name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - run: pip install pandas pytest
      - run: pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - name: Install security tools
        run: pip install bandit==1.9.4 bandit-sarif-formatter==1.1.1 pip-audit==2.10.1
      - name: Run bandit (SAST) — fail on HIGH severity findings
        run: |
          bandit -r resources/home/dnanexus/purple_plotter/ tests/ \
            -lll -f sarif -o bandit.sarif
      - name: Upload bandit SARIF to Security tab
        if: always()
        continue-on-error: true  # SARIF upload requires GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@17a820bf2e43b47be2c72b39cc905417bc1ab6d0  # v3.28.6
        with:
          sarif_file: bandit.sarif
      - name: Run pip-audit (CVE scan) — fail on any finding
        if: always()
        run: pip-audit -r requirements.txt
